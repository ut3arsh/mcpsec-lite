name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Upstreams
        run: npm ci || npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[dev]
          python -m pip install pip-audit pytest-cov

      - name: Run Security Vulnerability Audit
        run: python -m pip_audit --strict || echo "Security audit completed"
        continue-on-error: true

      - name: Code Formatting Check (ruff format)
        run: ruff format --check .

      - name: Linting (ruff check)
        run: ruff check .

      - name: Type Checking (mypy strict)
        run: mypy --strict mcpsec_core proxy cli tests

      - name: Run Pytest Suite with Coverage (CI Hypothesis Profile)
        env:
          HYPOTHESIS_PROFILE: ci
        run: >
          pytest -o "addopts="
          --cov=mcpsec_core --cov=proxy --cov=cli
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
