name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Upstreams
        run: npm ci


      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pip-audit pytest-cov pytest pytest-asyncio pytest-timeout hypothesis ruff mypy types-pyyaml

      - name: Run Security Vulnerability Audit
        run: python -m pip_audit --strict || echo "Security audit completed"
        continue-on-error: true

      - name: Code Formatting Check (ruff format)
        run: ruff format --check .

      - name: Linting (ruff check)
        run: ruff check .

      - name: Type Checking (mypy strict)
        run: mypy --strict mcpsec_core proxy cli tests benchmark

      - name: Run Core Suite with Coverage Gate (CI Hypothesis Profile)
        env:
          HYPOTHESIS_PROFILE: ci
        run: >
          pytest -o "addopts="
          --cov=mcpsec_core
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Report Proxy and CLI Coverage (Report Only)
        run: >
          pytest -o "addopts="
          --cov=proxy --cov=cli
          --cov-branch
          --cov-report=term-missing
        continue-on-error: true
