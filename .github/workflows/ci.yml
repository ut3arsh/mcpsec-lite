name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node Upstreams
        run: npm ci


      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pip-audit pytest-cov pytest pytest-asyncio pytest-timeout hypothesis ruff mypy types-pyyaml

      - name: Run Security Vulnerability Audit
        run: python scripts/run_audit.py

      - name: Code Formatting Check (ruff format)
        run: ruff format --check .

      - name: Linting (ruff check)
        run: ruff check .

      - name: Type Checking (mypy strict)
        run: mypy --strict mcpsec_core proxy cli tests benchmark scripts

      - name: Run Core Suite with Coverage Gate (CI Hypothesis Profile)
        env:
          HYPOTHESIS_PROFILE: ci
        run: >
          pytest -rs -o "addopts="
          --cov=mcpsec_core
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage_core.json
          --junitxml=test-results.xml
          --cov-fail-under=90

      - name: Save Core Coverage Data File
        shell: bash
        run: cp .coverage .coverage.${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Report Proxy and CLI Coverage (Report Only)
        run: >
          pytest -o "addopts="
          --cov=proxy --cov=cli
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage_proxy.json
        continue-on-error: true

      - name: Record Test & Coverage Step Summary
        if: always()
        run: python scripts/record_step_summary.py

      - name: Upload Coverage & Step Summary Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage_core.json
            coverage_proxy.json
            step_summary.md

      - name: Upload Raw Coverage Data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage.${{ matrix.os }}-py${{ matrix.python-version }}

  coverage-gate:
    name: Combined Coverage Gate
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Coverage Tools
        run: pip install coverage

      - name: Download Raw Coverage Data
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: raw-coverage-*
          merge-multiple: true

      - name: Combine Coverage & Generate Report
        run: |
          coverage combine
          coverage json --include="mcpsec_core/*" -o coverage_core_combined.json

      - name: Enforce Combined Coverage Gate (>= 90.00% stmts & branches)
        run: python scripts/check_coverage.py coverage_core_combined.json

      - name: Upload Combined Gate Summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-coverage-gate-summary
          path: |
            coverage_core_combined.json
            step_summary_gate.md
