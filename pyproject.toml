[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpsec-lite"
version = "0.1.0"
description = "Deterministic runtime policy and session-level flow control for MCP tool calls"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Utkarsh Anand" }
]
dependencies = [
    "mcp==2.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
mcpsec-proxy = "proxy.main:main"
mcpsec-replay = "cli.replay:main"
mcpsec-policy = "cli.policy_cli:main"
mcpsec-approve = "cli.approve_cli:main"
mcpsec-pin = "cli.pin_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mcpsec_core", "proxy", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true



[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
timeout_method = "thread"
addopts = "-m 'not integration and not live and not slow'"
markers = [
    "integration: integration tests against external or real processes",
    "live: live tests requiring external network or live services",
    "slow: tests that take longer to run (e.g. stress or extended property tests)",
]

[tool.coverage.run]
relative_files = true
branch = true
source = ["mcpsec_core"]

[tool.coverage.report]
precision = 2

